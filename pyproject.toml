[project]
name = "dbt-hypermarche"
version = "0.1.0"
description = "Industrialisation données hypermarché 🛒 avec dbt"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbt-snowflake>=1.10.3", # adapter dbt pour snowflake
    "faker>=40.43.0",        # pour générer des données factices
    "polars>=2.0.0",         # pour manipuler des dataframes en mémoire
]

[dependency-groups]
dev = [
    "prek>=0.5.5",                     # pre-commit
    "ruff>=0.17.0",                    # formatage
    "ty>=0.0.86",                      # typage python
    "shandy-sqlfmt[jinjafmt]>=0.28.2", # formatage sql
    "dbt-colibri>=0.3.7",              # lineage colonne
]

[tool.sqlfmt]
exclude = [
    "dbt/target/**/*",       # fichiers générés par dbt
    "dbt/dbt_packages/**/*", # extensions dbt
]
